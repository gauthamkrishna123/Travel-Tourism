<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Contact Us</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: Arial, sans-serif;
        background: #f2f2f2;
      }
      nav {
        position: relative;
        display: flex;
        justify-content: space-between;
        width: 100%;
        min-height: 70px;
        background-color: rgb(42, 3, 79);
        color: aliceblue;
        align-items: center;
        padding: 0% 15%;

        animation: color 6s ease-in-out infinite;
      }
      @keyframes color {
        0% {
          background-color: rgb(228, 193, 13);
        }
        25% {
          background-color: rgb(252, 41, 22);
        }
        50% {
          background-color: rgb(20, 20, 220);
        }
        75% {
          background-color: darkmagenta;
        }
        100% {
          background-color: rgb(246, 173, 4);
        }
      }
      .navlist {
        display: flex;

        gap: 10%;
      }
      nav h1 span {
        color: rgb(9, 225, 9);
      }
      nav h1 {
        font-family:
          "Gill Sans", "Gill Sans MT", Calibri, "Trebuchet MS", sans-serif;
      }
      .navlist li {
        list-style: none;
      }
      .navlist li a {
        text-decoration: none;
        color: aliceblue;
      }
      .navlist li a:hover {
        color: rgb(35, 174, 234);
        /* background:linear-gradient(90deg,rgb(4, 252, 45),white); */
      }
      .contact-container {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 30px;
      }

      .contact-box {
        width: 900px;
        display: flex;
        background: white;
        border-radius: 15px;
        overflow: hidden;
        box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
      }

      /* Left Side */
      .contact-info {
        flex: 1;
        background: #2a034f;
        color: white;
        padding: 50px 40px;
      }

      .contact-info h1 {
        font-size: 35px;
        margin-bottom: 20px;
      }

      .contact-info p {
        line-height: 1.6;
        margin-bottom: 30px;
      }

      .info {
        margin-bottom: 20px;
      }

      .info h3 {
        margin-bottom: 5px;
      }

      /* Form */
      .contact-form {
        flex: 1.3;
        padding: 50px 40px;
      }

      .contact-form h2 {
        font-size: 30px;
        margin-bottom: 25px;
        color: #2a034f;
      }

      .input-group {
        margin-bottom: 18px;
      }

      .input-group label {
        display: block;
        margin-bottom: 7px;
        font-weight: bold;
      }

      .input-group input,
      .input-group textarea {
        width: 100%;
        padding: 12px;
        border: 1px solid #ccc;
        border-radius: 6px;
        font-size: 16px;
        outline: none;
      }

      .input-group input:focus,
      .input-group textarea:focus {
        border-color: #2a034f;
      }

      textarea {
        height: 120px;
        resize: vertical;
      }

      button {
        width: 100%;
        padding: 13px;
        border: none;
        border-radius: 6px;
        background: #2a034f;
        color: white;
        font-size: 17px;
        cursor: pointer;
      }

      button:hover {
        background: #43077d;
      }

      /* Responsive */
      @media (max-width: 700px) {
        .contact-box {
          flex-direction: column;
        }

        .contact-info,
        .contact-form {
          padding: 35px 25px;
        }

        .contact-info h1 {
          font-size: 28px;
        }

        .contact-form h2 {
          font-size: 25px;
        }
      }
    </style>
  </head>

  <body>
    <nav>
      <h1>Explore <span>Kerala</span></h1>
      <ul class="navlist">
        <li><a href="index.html">Home</a></li>
        <li><a href="destination.html">Destination</a></li>
        <li><a href="booknow.html">Packeges</a></li>
        <li><a href="gallery.html">Gallery</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>
    <div class="contact-container">
      <div class="contact-box">
        <!-- Contact Information -->
        <div class="contact-info">
          <h1>Contact Us</h1>

          <p>
            Have questions about your next trip? Get in touch with us and we'll
            help you plan your perfect journey.
          </p>

          <div class="info">
            <h3>📍 Address</h3>
            <p>Kerala, India</p>
          </div>

          <div class="info">
            <h3>📞 Phone</h3>
            <p>+91 98765 43210</p>
          </div>

          <div class="info">
            <h3>✉ Email</h3>
            <p>info@example.com</p>
          </div>
        </div>

        <!-- Contact Form -->
        <div class="contact-form">
          <h2>Send us a Message</h2>

          <form>
            <div class="input-group">
              <label for="name">Name</label>
              <input
                type="text"
                id="name"
                name="name"
                placeholder="Enter your name"
                required
              />
            </div>

            <div class="input-group">
              <label for="email">Email</label>
              <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                required
              />
            </div>

            <div class="input-group">
              <label for="subject">Subject</label>
              <input
                type="text"
                id="subject"
                name="subject"
                placeholder="Enter subject"
                required
              />
            </div>

            <div class="input-group">
              <label for="message">Message</label>
              <textarea
                id="message"
                name="message"
                placeholder="Write your message..."
                required
              ></textarea>
            </div>

            <button type="submit">Send Message</button>
          </form>
        </div>
      </div>
    </div>
  </body>
</html>
```
